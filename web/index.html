<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e131a" />
<script>
// theme before the first paint: the saved choice ("wk-theme"), else the system preference; dark is the default
(function () { var t = null; try { t = localStorage.getItem("wk-theme"); } catch (e) { /* storage blocked */ }
  if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
  document.documentElement.dataset.theme = t;
  var m = document.querySelector('meta[name="theme-color"]'); if (m && t === "light") m.content = "#f6f8fb"; })();
</script>
<meta name="description" content="WorldKit: film an object, get a measured 3D model you can print." />
<title>WorldKit</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/logo.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
